name: Release OpenQL

# A tag v* builds OpenQL for Linux, Windows and macOS and publishes the release.
# A pull request that touches the build runs the same builds, without publishing.

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
    paths: ['src/**', 'Makefile', 'tools/**', 'roms.json', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsdl2-dev
      - run: make openql qlrun && make test
      - name: Package
        run: |
          d=openql-linux-x86_64
          mkdir -p $d
          cp openql qlrun roms.json README.md LICENSE $d/
          cp tools/openql-fetch-roms $d/
          strip $d/openql $d/qlrun
          tar czf $d.tar.gz $d
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: openql-linux-x86_64.tar.gz }

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: make zip mingw-w64-x86_64-gcc mingw-w64-x86_64-SDL2 mingw-w64-x86_64-pkgconf mingw-w64-x86_64-python
      - run: make openql qlrun LDLIBS="-static-libgcc"
      - run: make test
      - name: Package
        run: |
          d=openql-windows-x86_64
          mkdir -p $d
          cp openql.exe qlrun.exe roms.json README.md LICENSE $d/
          cp tools/openql-fetch-roms $d/openql-fetch-roms.py
          for exe in openql.exe qlrun.exe; do
            ldd $exe | awk '/mingw64/ {print $3}' | xargs -r -I{} cp -n {} $d/
          done
          strip $d/*.exe
          zip -r $d.zip $d
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: openql-windows-x86_64.zip }

  macos:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: brew install sdl2
      - run: make openql qlrun CC=clang && make test CC=clang
      - name: Package (SDL2 beside the program)
        run: |
          d=openql-macos-arm64
          mkdir -p $d
          cp openql qlrun roms.json README.md LICENSE $d/
          cp tools/openql-fetch-roms $d/
          lib=$(otool -L openql | awk '/libSDL2/ {print $1}')
          cp "$lib" $d/
          install_name_tool -change "$lib" "@executable_path/$(basename "$lib")" $d/openql
          codesign --force -s - $d/openql
          otool -L $d/openql
          tar czf $d.tar.gz $d
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: openql-macos-arm64.tar.gz }

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist && sha256sum * > SHA256SUMS && cd ..
          gh release create "$GITHUB_REF_NAME" dist/* --title "OpenQL ${GITHUB_REF_NAME#v}" --notes-file RELEASE-NOTES.md
