name: Release OpenQL

# A tag v* builds OpenQL for Linux, Windows and macOS and publishes the release.
# Running it by hand on main with a version (v0.1.0) does the same and makes the tag.
# A version with a dash (v0.1.1-rc1) is published as a pre-release.
# A pull request that touches the build runs the same builds, without publishing.

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
    paths: ['src/**', 'Makefile', 'tools/**', 'roms.json', '.github/workflows/release.yml']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to make on this commit, such as v0.1.0 (empty builds only)'
        required: false

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsdl2-dev libgtk-3-dev meson ninja-build
      - run: make openql qlrun && make test
      - name: Package
        run: |
          d=openql-linux-x86_64
          mkdir -p $d
          cp openql qlrun roms.json README.md LICENSE $d/
          cp tools/openql-fetch-roms $d/
          strip $d/openql $d/qlrun
          tar czf $d.tar.gz $d
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: openql-linux-x86_64.tar.gz }

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: make zip mingw-w64-x86_64-gcc mingw-w64-x86_64-SDL2 mingw-w64-x86_64-pkgconf mingw-w64-x86_64-python mingw-w64-x86_64-meson mingw-w64-x86_64-ninja git
      - run: make openql qlrun LDLIBS="-static-libgcc"
      - run: make test
      - name: Package
        run: |
          d=openql-windows-x86_64
          mkdir -p $d
          cp openql.exe qlrun.exe roms.json README.md LICENSE $d/
          cp tools/openql-fetch-roms $d/openql-fetch-roms.py
          for exe in openql.exe qlrun.exe; do
            ldd $exe | awk '/mingw64/ {print $3}' | xargs -r -I{} cp -n {} $d/
          done
          strip $d/*.exe
          zip -r $d.zip $d
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: openql-windows-x86_64.zip }

  macos:
    runs-on: macos-15-intel   # the FPU needs an 80-bit long double (x86-64) or IEEE quad (Linux ARM64); macOS ARM64 has neither
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: brew install sdl2 meson ninja
      - run: make openql qlrun CC=clang && make test CC=clang
      - name: Package (SDL2 beside the program)
        run: |
          d=openql-macos-x86_64
          mkdir -p $d
          cp openql qlrun roms.json README.md LICENSE $d/
          cp tools/openql-fetch-roms $d/
          lib=$(otool -L openql | awk '/libSDL2/ {print $1}')
          cp "$lib" $d/
          install_name_tool -change "$lib" "@executable_path/$(basename "$lib")" $d/openql
          codesign --force -s - $d/openql
          otool -L $d/openql
          tar czf $d.tar.gz $d
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: openql-macos-x86_64.tar.gz }

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.version, 'v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version || github.ref_name }}
        run: |
          cd dist && sha256sum * > SHA256SUMS && cd ..
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac   # v0.1.1-rc1 and the like are release candidates
          if gh release view "$TAG" > /dev/null 2>&1; then
            # The tag was pushed again (a history rewrite moves it): the release gets this commit's builds.
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file RELEASE-NOTES.md $pre
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "OpenQL ${TAG#v}" --notes-file RELEASE-NOTES.md $pre
          fi
